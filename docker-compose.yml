version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: threat-telemetry-db
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: threat_user
      POSTGRES_PASSWORD: threat_pass_dev
      POSTGRES_DB: threat_telemetry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U threat_user -d threat_telemetry']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
